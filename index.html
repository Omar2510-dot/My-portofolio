<!DOCTYPE html>
<html>
<head>
    <title>Portofolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <header>
        <a href="#" class="logo">Omar</a>
        <nav>
            <a href="#skills">Skills</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <section class="main">
        <div>
            <h2>Hello I am Omar.<br><span>I am a Software developer.</span></h2>
            <h3>I build amaizing websites.</h3>
            <a href="#projects" class="mainbutton">View my work</a>
            <div class="socialicons">
                <a href="#"><i class="fab fa-youtube"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-facebook"></i></a>
            </div>
        </div>
    </section>
    <section class="cards" id="skills">
        <h2 class="title">Skills</h2>
        <div class="content">
            <div class="card">
                <div class="icon">
                    <i class="fas fa-code"></i>
                </div>
                <div class="info">
                    <h3>Web development</h3>
                    <p>Create and develop websites using html and css.</p>
                </div>
            </div>
            <div class="card">
                <div class="icon">
                    <i class="fas fa-mobile"></i>
                </div>
                <div class="info">
                    <h3>Mobile development</h3>
                    <p>Create and develop apps using flutter.</p>
                </div>
            </div>
            <div class="card">
                <div class="icon">
                    <i class="fas fa-gamepad"></i>
                </div>
                <div class="info">
                    <h3>Game development</h3>
                    <p>Create and develop games.</p>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
